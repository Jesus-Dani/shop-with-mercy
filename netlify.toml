[build]
  command   = "npm run build && node scripts/bundle-lambda.mjs"
  publish   = "build"

[build.environment]
  NODE_VERSION = "20"

# No node_bundler override — scripts/bundle-lambda.mjs pre-bundles the
# framework function into a self-contained ESM file (node:* imports only),
# so Netlify deploys it as-is without needing to resolve node_modules.