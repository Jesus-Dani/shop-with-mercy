[build]
  command   = "npm run build && node scripts/bundle-lambda.mjs"
  publish   = "build"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from   = "/*"
  to     = "/.netlify/functions/sveltekit-render"
  status = 200
  force  = false

# Rate limiting on /admin/login requires a Netlify Pro plan.
# Configure it in the Netlify dashboard: Site → Security → Traffic rules
# Recommended rule: block after 5 requests per 60 s per IP on path /admin/login.
# Application-level rate limiting (via Supabase failed_login_attempts) is also
# implemented in the login action as a fallback that works on any plan.